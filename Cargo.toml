[package]
name = "mikrotik-audit-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Read-only security audit MCP server for MikroTik RouterOS"
authors = ["idesyatov"]
repository = "https://github.com/idesyatov/mikrotik-audit-mcp"
license = "MIT"
readme = "README.md"

[dependencies]
# Official Rust SDK for the Model Context Protocol (stdio transport).
# Used starting from Stage 1.
rmcp = { version = "2", features = ["server", "transport-io"] }

# Async runtime. The `process` feature is for SSH via subprocess (Stage 2).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
